<header class="masthead">
  <div class="wrap masthead-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <span class="numero">&#8470;</span> Quantum Mathematics
      <span class="wordmark-sub">UTSA</span>
    </a>
    <nav aria-label="Main">
      <ul>
        {%- for item in site.data.navigation %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
