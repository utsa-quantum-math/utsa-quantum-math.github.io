<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title desc"><title id="title">Eight prescriptions for three tests</title><desc id="desc">Eight columns represent witnesses for all eight possible patterns on three tests. Filled purple circles mean high and open purple circles mean low. The columns are low low low, low low high, low high low, low high high, high low low, high low high, high high low, and high high high.</desc><g font-family="Georgia,serif" font-size="18" fill="#5e2a6e"><text x="160" y="42" text-anchor="middle">1</text><text x="218" y="42" text-anchor="middle">2</text><text x="276" y="42" text-anchor="middle">3</text><text x="334" y="42" text-anchor="middle">4</text><text x="392" y="42" text-anchor="middle">5</text><text x="450" y="42" text-anchor="middle">6</text><text x="508" y="42" text-anchor="middle">7</text><text x="566" y="42" text-anchor="middle">8</text><text x="30" y="88">Test 1</text><circle cx="160" cy="82" r="8" fill="#fdfcfa" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="218" cy="82" r="8" fill="#fdfcfa" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="276" cy="82" r="8" fill="#fdfcfa" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="334" cy="82" r="8" fill="#fdfcfa" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="392" cy="82" r="8" fill="#5e2a6e" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="450" cy="82" r="8" fill="#5e2a6e" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="508" cy="82" r="8" fill="#5e2a6e" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="566" cy="82" r="8" fill="#5e2a6e" stroke="#5e2a6e" stroke-width="1.8"/><text x="30" y="143">Test 2</text><circle cx="160" cy="137" r="8" fill="#fdfcfa" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="218" cy="137" r="8" fill="#fdfcfa" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="276" cy="137" r="8" fill="#5e2a6e" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="334" cy="137" r="8" fill="#5e2a6e" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="392" cy="137" r="8" fill="#fdfcfa" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="450" cy="137" r="8" fill="#fdfcfa" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="508" cy="137" r="8" fill="#5e2a6e" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="566" cy="137" r="8" fill="#5e2a6e" stroke="#5e2a6e" stroke-width="1.8"/><text x="30" y="198">Test 3</text><circle cx="160" cy="192" r="8" fill="#fdfcfa" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="218" cy="192" r="8" fill="#5e2a6e" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="276" cy="192" r="8" fill="#fdfcfa" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="334" cy="192" r="8" fill="#5e2a6e" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="392" cy="192" r="8" fill="#fdfcfa" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="450" cy="192" r="8" fill="#5e2a6e" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="508" cy="192" r="8" fill="#fdfcfa" stroke="#5e2a6e" stroke-width="1.8"/><circle cx="566" cy="192" r="8" fill="#5e2a6e" stroke="#5e2a6e" stroke-width="1.8"/></g><g font-family="Arial,sans-serif" font-size="14" fill="#695b70"><text x="160" y="18">Witnesses</text><circle cx="170" cy="244" r="6" fill="#5e2a6e"/><text x="188" y="249">high</text><circle cx="280" cy="244" r="6" fill="#fdfcfa" stroke="#5e2a6e" stroke-width="1.5"/><text x="298" y="249">low</text></g></svg>